.dirbox .abtn{flex:1; font-size:.85rem;}
.abtn.dir.active{background:var(--maroon); color:#fff; border-color:var(--maroon);}
.trout{margin-top:12px;}
.trout .en{font-size:1.25rem; font-weight:700;}
.tr-h{margin:4px 6px 0 0; font-size:.75rem; font-weight:600;}
.sect{

  color:var(--maroon); margin:16px 0 4px;
}
.tip{font-size:.78rem; color:#6b5d48; margin-top:10px; line-height:1.4;}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.abtn{
  border:1.5px solid var(--maroon); background:var(--card); color:var(--maroon);

function norm(s){
  var r = String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  for (var i=0;i<NF.length;i++){ var p = NF[i][0].split("|"); for (var j=0;j<p.length;j++){ r = r.split(p[j]).join(NF[i][1]); } }
  return r.replace(/\s+/g," ").trim();
}
function esc(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function tokens(s){ return norm(s).split(/[^a-z0-9]+/).filter(function(t){ return t.length>0; }); }

  try{ return !!window.speechSynthesis; }catch(e){ return false; }

function speak(txt, lang){
  if (!TTS || !txt) return;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = lang || "en-US"; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

var memStore = {};
function store(k, v){
  try{
    if (v === undefined){ return localStorage.getItem(k); }
    localStorage.setItem(k, v); return v;
  }catch(e){
    if (v === undefined){ return memStore[k] || null; }
    memStore[k] = v; return v;
  }
}
function loadFavs(){

function buildMaps(){
  var fw = {}, rev = {};
  for (var i=0;i<DICO.length;i++){
    var k = DICO[i][0], v = DICO[i][1];
    if (!(k in fw)) fw[k] = v;
    var ve = norm(v);
    if (!(ve in rev)) rev[ve] = k;
  }
  return { fw: fw, rev: rev };
}

function escRe(s){
  var r = "";
  for (var i = 0; i < s.length; i++) {
    var c = s.charAt(i);
    r += ("^"===c || "$"===c || "*"===c || "+"===c || "."===c || "?"===c ||
          "("===c || ")"===c || "|"===c || "["===c || "]"===c || "{"===c ||
          "}"===c || "\\"===c) ? "\\"+c : c;
  }
  return r;
}
function applyMulti(s, dir){
  var list = MULTI, i, re, vals = [];
  if (dir === "ef"){
    list = MULTI.map(function(m){ return [norm(m[1]), m[0]]; }).sort(function(a,b){ return b[0].length-a[0].length; });
  }
  for (i=0;i<list.length;i++){
    re = new RegExp("(^|\\s)"+escRe(list[i][0])+"(?=\\s|$)", "g");
    s = s.replace(re, function(mm, p1){
      vals.push(list[i][1]);
      return p1 + "M" + (vals.length-1) + " ";
    });
  }
  return { s: s.replace(/\s+/g," ").trim(), vals: vals };
}
function lookupWord(w, map){
  if (w in map) return map[w];
  if (w.length > 2 && /s$/.test(w) && (w.slice(0,-1) in map)) return map[w.slice(0,-1)];
  if (w.length > 3 && /es$/.test(w) && (w.slice(0,-2) in map)) return map[w.slice(0,-2)];
  if (w.length > 2 && /x$/.test(w) && (w.slice(0,-1) in map)) return map[w.slice(0,-1)];
  return null;
}

  var parts=[], h=Math.floor(n/100), r=n%100;
  if (h>0){ parts.push(U[h],"hundred"); if (r>0) parts.push("and"); }
  if (r>0) parts = parts.concat(under100(r));
  return parts;
}
function numToEn(n){
  n = Math.floor(Math.abs(Number(n)||0));
  if (n === 0) return "zero";
  if (n<1000) return under1000(n).join(" ").replace(/ - /g,"-").replace(/  +/g," ");
  var parts=[];
  var scales=[[1000000000,"billion"],[1000000,"million"],[1000,"thousand"]];
  var rest=n, applied=false;
  for (var i=0;i<scales.length;i++){
    var v = Math.floor(rest/scales[i][0]);
    if (v>0){ parts = parts.concat(under1000(v)); parts.push(scales[i][1]); rest = rest % scales[i][0]; applied = true; }
  }
  if (rest>0){ if (applied && rest<100) parts.push("and"); parts = parts.concat(under1000(rest)); }
  return parts.join(" ").replace(/ - /g,"-").replace(/  +/g," ");
}
function numPro(s){
  var map = {zero:"ziro",one:"ouane",two:"tou",three:"ssri",four:"fore",five:"faïve",
  six:"siksse",seven:"seuvène",eight:"èïte",nine:"naïne",ten:"tène",
  eleven:"ileuvène",twelve:"touelv",thirteen:"seurssine",fifteen:"fiftine",
  twenty:"touenti",thirty:"seurssi",forty:"forti",fifty:"fifti",
  sixty:"siksti",seventy:"seuvanti",eighty:"èïti",ninety:"naïnti",
  hundred:"handrede",thousand:"thaouzande",million:"milïone",billion:"bilïone",
  and:"annde"};
  return norm(s).split(/[^a-z]+/).filter(Boolean).map(function(w){
    return map[w] || w;
  }).join(" ").replace(/ - /g,"-");
}

/* traduction mot à mot : renvoie la chaîne traduite (mots inconnus entre *) */
function glossTrad(raw, dir){
  var map = dir === "ef" ? MAPS.rev : MAPS.fw;
  var am = applyMulti(norm(raw), dir);
  var toks = am.s.split(/[^a-zA-Z0-9]+/).filter(Boolean);
  var out = [];
  for (var i=0;i<toks.length;i++){
    var t = toks[i];
    var low = t.toLowerCase();
    if (/^m\d+$/.test(low)){
      var ph = parseInt(low.slice(1),10);
      if (ph < am.vals.length && am.vals[ph]){ out.push(am.vals[ph]); }
      continue;
    }
    if (/^\d+$/.test(low)){ out.push(numToEn(parseInt(low,10))); continue; }
    var tr = lookupWord(low, map);
    if (tr !== null){ out.push(tr); continue; }
    if (/^[A-Z]/.test(t) && t.length>1 && t === t.toUpperCase()){ out.push(t); continue; }
    out.push("*"+low+"*");
  }
  return out.join(" ").replace(/\s+/g," ").trim();
}

/* phrases les plus proches (recherche floue) */
var STOPF = {le:1,la:1,les:1,l:1,un:1,une:1,des:1,du:1,de:1,d:1,a:1,au:1,aux:1,
  et:1,je:1,tu:1,il:1,elle:1,on:1,nous:1,vous:1,ils:1,elles:1,
  mon:1,ma:1,mes:1,ton:1,ta:1,tes:1,son:1,sa:1,ses:1,ce:1,cet:1,cette:1,ces:1,
  est:1,suis:1,es:1,pour:1,avec:1,dans:1,sur:1};
var STOPE = {a:1,an:1,the:1,is:1,are:1,am:1,do:1,does:1,i:1,you:1,my:1,your:1,
  this:1,that:1,to:1,of:1,and:1,in:1,on:1,at:1,it:1,we:1,me:1,for:1};

function fuzzyTrad(raw, dir){
  var qtok = tokens(raw);
  var stop = dir === "ef" ? STOPE : STOPF;
  var qf = qtok.filter(function(t){ return !stop[t] && t.length>1; });
  if (!qf.length) qf = qtok;
  var res = [];
  for (var i=0;i<P.length;i++){
    var parts = P[i].split("|");
    var side = dir === "ef" ? parts[2] : parts[1];
    var ptok = tokens(side);
    var matched = 0;
    for (var j=0;j<qf.length;j++){ if (ptok.indexOf(qf[j])>=0) matched++; }
    if (matched === 0) continue;
    var score = matched / qf.length;
    if (score < 0.34) continue;
    res.push({ p: parseP(P[i], i), score: score, matched: matched });
  }
  res.sort(function(a,b){ return b.score - a.score || b.matched - a.matched; });
  return res.slice(0,3);
}

/* construction du résultat du traducteur (HTML pur, sans DOM) */
function catLabel(id){
  for (var i=0;i<CATS.length;i++){ if (CATS[i][0]===id) return CATS[i][1]; }
  return id;
}
function tradResultHtml(raw, dir){
  var matches = fuzzyTrad(raw, dir);
  var gloss = glossTrad(raw, dir);
  var known = gloss && gloss.indexOf("*") === -1;
  var h = "";
  if (matches.length){
    h += '<div class="cat-title">✅ Phrases types par situation</div>';
    for (var i=0;i<matches.length;i++){
      h += phraseCard(matches[i].p, catLabel(matches[i].p.cat), true);
    }
  }
  if (gloss && (known || matches.length)){
    h += '<div class="cat-title">📝 Mot à mot (littéral)</div>'
      + '<div class="card"><div class="en">' + esc(gloss) + '</div>'
      + (TTS ? '<div class="actions"><button class="abtn ttsb" data-txt="'+esc(gloss)+'" data-lang="'+(dir==="fe"?"en-US":"fr-FR")+'">🔊 Écouter</button></div>' : '')
      + '<p class="tip">Traduction littérale mot à mot, 100 % hors ligne — l\'ordre des mots peut être approximatif. Montre la phrase 🇬🇧 à ton interlocuteur en cas de doute.</p></div>';
  }
  if (!h){
    h = '<div class="card"><p>🤔 Aucune correspondance dans le kit.<br>Essaie avec des mots plus simples, ou pioche dans les catégories de phrases — elles marchent toutes hors ligne.</p></div>';
  }
  return h;
}

/* ---------------- état traducteur ---------------- */
var trDir = "fe", trVal = "", trOutHtml = "";
var hist = [];
try{ hist = JSON.parse(store("qatar-trad") || "[]") || []; }catch(e){ hist = []; }
function saveHist(a){ store("qatar-trad", JSON.stringify(a.slice(0,8))); }

function histHtml(){
  if (!hist.length) return "";
  var h = '<div class="sect">🕘 Récentes</div><div>';
  for (var i=0;i<hist.length;i++){
    h += '<button class="abtn tr-h" data-i="'+i+'">'+esc(hist[i].q)+'</button>';
  }
  return h + '</div>';
}
function translatorBlock(){
  return '<div class="info-card">'
    + '<h3>🈯 Traducteur 100 % hors ligne</h3>'
    + '<div class="dirbox">'
      + '<button class="abtn dir'+(trDir==="fe"?" active":"")+'" data-dir="fe">🇫🇷 FR → 🇬🇧 EN</button>'
      + '<button class="abtn dir'+(trDir==="ef"?" active":"")+'" data-dir="ef">🇬🇧 EN → 🇫🇷 FR</button>'
    + '</div>'
    + '<div class="numbox"><input id="trIn" type="text" placeholder="Ex : où sont les toilettes ?" autocomplete="off" autocapitalize="off" autocorrect="off"></div>'
    + '<button id="trGo" class="abtn big" style="margin-top:10px;">Traduire (hors ligne)</button>'
    + '<div class="trout" id="trOut">'+trOutHtml+'</div>'
    + histHtml()
    + '<p class="tip"><b>Astuce :</b> tape ta phrase entière — je trouve les phrases types les plus proches <b>et</b> je te donne aussi le mot à mot. Tout fonctionne sans réseau.</p>'
    + '</div>';
}
function doTrad(){
  var el = document.getElementById("trIn");
  var raw = ((el && el.value) || trVal || "").trim();
  trVal = raw;
  if (!raw){
    trOutHtml = '<div class="card"><p>Tape une phrase d\'abord 🙂</p></div>';
    render(); return;
  }
  trOutHtml = tradResultHtml(raw, trDir);
  hist.unshift({ q: raw, dir: trDir });
  for (var i=1;i<hist.length;i++){
    if (hist[i].q === raw && hist[i].dir === trDir){ hist.splice(i,1); i--; }
  }
  hist = hist.slice(0,8);
  saveHist(hist);
  render();
}
function attachTrad(){
  var i = document.getElementById("trIn");
  if (!i) return;
  i.value = trVal;
  i.addEventListener("input", function(){ trVal = this.value; });
  i.addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); doTrad(); } });
  var go = document.getElementById("trGo");
  if (go) go.addEventListener("click", doTrad);
  var dirs = document.querySelectorAll(".dir");
  for (var k=0;k<dirs.length;k++){
    dirs[k].addEventListener("click", function(){
      trDir = this.getAttribute("data-dir");
      trOutHtml = "";
      render();
    });
  }
  var hs = document.querySelectorAll(".tr-h");
  for (var m=0;m<hs.length;m++){
    hs[m].addEventListener("click", function(){
      var hh = hist[parseInt(this.getAttribute("data-i"),10)];
      if (!hh) return;
      trDir = hh.dir; trVal = hh.q;
      trOutHtml = tradResultHtml(hh.q, hh.dir);
      render();
    });
  }
}

/* ---------------- rendu des phrases ---------------- */
function parseP(row, idx){
  var f = row.split("|");
  return { id: "p"+idx, cat: f[0], fr: f[1], en: f[2], pro: f[3]||"", note: f[4]||"" };
}
function parseW(row, idx){
  var f = row.split("|");
  return { id: f[0] || ("w"+idx), cat: f[4] || "base", fr: f[1], en: f[2], pro: f[3] || "" };
}
function wordCard(w){
  return '<div class="card"><div class="lbl">'+catLabel(w.cat)+' · mot</div>'
    + '<div class="fr">'+esc(w.fr)+'</div><div class="en">'+esc(w.en)+'</div>'
    + '<div class="pro">'+esc(w.pro)+'</div>'
    + (TTS?'<div class="actions"><button class="abtn ttsb" data-txt="'+esc(w.en)+'" data-lang="en-US">🔊</button></div>':'')
    + '</div>';
}
function phraseCard(p, label, withCat){
  var fav = favs.indexOf(p.id) >= 0;
  return '<div class="card" id="'+p.id+'">'
    + '<div class="lbl">'+esc(label)+(withCat?'':'')+'</div>'
    + '<div class="fr">'+esc(p.fr)+'</div>'
    + '<div class="en">'+esc(p.en)+'</div>'
    + '<div class="pro">'+esc(p.pro)+'</div>'
    + (p.note?'<div class="note">'+esc(p.note)+'</div>':'')
    + '<div class="actions">'
    + (TTS?'<button class="abtn ttsb" data-txt="'+esc(p.en)+'" data-lang="en-US">🔊 Écouter</button>':'')
    + '<button class="abtn favb'+(fav?' on':'')+'" data-id="'+p.id+'">'+(fav?"★":"☆")+'</button>'
    + '</div></div>';
}

var PH = P.map(parseP);
var WD = W.map(parseW);

/* ---------------- infos ---------------- */
function infoBlock(){
  return '<div class="info-card">'
    + '<h3>ℹ️ À savoir avant de partir</h3>'
    + '<p><b>Langue</b> : l\'anglais est parlé partout à Doha (hôtels, aéroport, taxis, malls). L\'arabe est la langue officielle. Quelques mots arabes font toujours plaisir — voir la catégorie 🕌.</p>'
    + '<p><b>Argent</b> : le riyal qatarien (QAR). 1 QAR ≈ 2,50 €... à vérifier avant le départ. Les cartes sont acceptées presque partout ; un peu de cash utile pour petits taxis et souk.</p>'
    + '<p><b>Culture</b> : tenue sobre recommandée (épaules/genoux couverts en ville). Pendant le Ramadan, ne pas manger ni boire en public le jour. Alcool strictement encadré — zéro dans les bagages.</p>'
    + '<p><b>Déplacements</b> : Uber/Careem très faciles à Doha. La voiture est reine ; on conduit à droite (volant à gauche). Métro de Doha moderne et climatisé.</p>'
    + '<p><b>Chaleur</b> : eau en bouteille toujours, crème solaire, chapeau. Les bâtiments sont sur-climatisés : prévoir une surcouche légère.</p>'
    + '<p><b>Urgences</b> : police 999, ambulance 999. Mentionne « firefighter » pour être orienté vers les secours.</p>'
    + '<p><b>Électricité</b> : prises type G (britannique, 3 broches rectangulaires) — adaptateur indispensable.</p>'
    + '<p><b>Sim / réseau</b> : Ooredoo et Vodafone vendent des SIM touristiques à l\'aéroport ; eSIM dispo. Wifi gratuit quasi partout.</p>'
    + '</div>';
}

/* ---------------- recherche & rendu principal ---------------- */
function search(){
  var nq = norm(q);
  if (!nq) return null;
  var out = { ph: [], w: [] };
  for (var i=0;i<PH.length;i++){
    var p = PH[i];
    if (norm(p.fr).indexOf(nq)>=0 || norm(p.en).indexOf(nq)>=0 || norm(p.pro).indexOf(nq)>=0){
      out.ph.push(p);
    }
  }
  for (var j=0;j<WD.length;j++){
    var w = WD[j];
    if (norm(w.fr).indexOf(nq)>=0 || norm(w.en).indexOf(nq)>=0){
      out.w.push(w);
    }
  }
  return out;
}
var elChips = document.getElementById("chips");
var elList  = document.getElementById("list");
function render(){
  var i, h = "";
  h += '<div class="numbox" style="margin:0 0 12px;">'
    + '<input id="q" type="search" placeholder="🔎 Chercher une phrase…" value="'+esc(q)+'" autocomplete="off">'
    + (q?'<button id="clearq" class="abtn" style="border:0;background:none;color:#8a6d3b;font-weight:800;">✕</button>':'')
    + '</div>';
  var catKeys = {};
  for (i=0;i<CATS.length;i++) catKeys[CATS[i][0]] = true;
  var chipHtml = "";
  for (i=0;i<CATS.length;i++){
    chipHtml += '<button class="chip'+(currentCat===CATS[i][0]&&!q?" on":"")+'" data-cat="'+CATS[i][0]+'">'+CATS[i][1]+'</button>';
  }
  if (favs.length){ chipHtml += '<button class="chip'+(currentCat==="fav"&&!q?" on":"")+'" data-cat="fav">⭐ Favorites</button>'; }
  elChips.innerHTML = chipHtml;
  if (q){
    var s = search();
    h += '<div class="cat-title">🔎 Résultats pour « '+esc(q)+' »</div>';
    if (!s || (!s.ph.length && !s.w.length)){
      h += '<div class="card"><p>Aucun résultat. Essaie la catégorie 🈯 Traducteur pour le mot à mot.</p></div>';
    } else {
      for (i=0;i<s.ph.length;i++){ h += phraseCard(s.ph[i], catLabel(s.ph[i].cat)); }
      for (i=0;i<s.w.length;i++){ h += wordCard(s.w[i]); }
    }
  } else if (currentCat === "trad"){
    h += translatorBlock();
  } else if (currentCat === "fav"){
    h += '<div class="cat-title">⭐ Mes phrases favorites</div>';
    var shown = 0;
    for (i=0;i<PH.length;i++){
      if (favs.indexOf(PH[i].id)>=0){ h += phraseCard(PH[i], catLabel(PH[i].cat)); shown++; }
    }
    if (!shown) h += '<div class="card"><p>Aucune favorite pour l\'instant — appuie sur ☆ pour épingler une phrase.</p></div>';
  } else if (currentCat === "infos"){
    h += infoBlock();
  } else {
    var label = catLabel(currentCat);
    h += '<div class="cat-title">'+label+'</div>';
    for (i=0;i<PH.length;i++){
      if (PH[i].cat === currentCat){ h += phraseCard(PH[i], label); }
    }
    for (i=0;i<WD.length;i++){
      if (WD[i].cat === currentCat){ h += wordCard(WD[i]); }
    }
  }
  elList.innerHTML = h;
  var elQ = document.getElementById("q");
  if (elQ){
    elQ.addEventListener("input", function(){ q = this.value; render(); });
  }
  var elClear = document.getElementById("clearq");
  if (elClear){ elClear.addEventListener("click", function(){ q = ""; render(); }); }
  attachTrad();
}
elChips.addEventListener("click", function(e){
  var c = e.target.closest(".chip");
  if (!c) return;
  currentCat = c.getAttribute("data-cat");
  q = "";
  render();
});
elList.addEventListener("click", function(e){
  var s = e.target.closest(".ttsb");
  if (s){ speak(s.getAttribute("data-txt"), s.getAttribute("data-lang")); return; }
  var f = e.target.closest(".favb");
  if (f){
    var id = f.getAttribute("data-id");
    var pos = favs.indexOf(id);
    if (pos >= 0){ favs.splice(pos,1); } else { favs.push(id); }
    saveFavs(favs); render();
  }
});
render();
